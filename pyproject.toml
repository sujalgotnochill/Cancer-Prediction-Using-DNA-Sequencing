[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-cancer"
version = "0.1.0"
description = "Modular architecture for DNA sequence-based cancer classification"
readme = "README.md"
requires-python = ">=3.9, <3.13"
license = "MIT"
authors = [
    { name = "Sujal Vishwakarma" },
    { name = "Contributors" }
]
keywords = ["bioinformatics", "dna-sequencing", "cancer-classification", "machine-learning", "k-mers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.23.0,<2.0.0",
    "pandas>=1.5.0,<3.0.0",
    "scikit-learn>=1.3.0,<1.4.0",
    "pyyaml>=5.4.0",
    "python-dotenv>=0.19.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
app = [
    "flask>=2.2.0,<4.0.0",
    "werkzeug>=2.2.0,<4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]
bio = [
    "biopython>=1.79",
]
deep-learning = [
    "tensorflow>=2.10.0; python_version < '3.12'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]

